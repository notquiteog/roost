<!doctype html>
<meta charset="utf-8">
<title>Roost</title>
<!-- Tauri requires a frontend directory to bundle. The real interface is
     served by the daemon and loaded as an external URL at startup, so this is
     only what shows if the daemon never came up. -->
<style>
  body { margin:0; height:100vh; display:grid; place-items:center; background:#16161a;
         color:#e6e4e0; font:14px/1.6 system-ui, sans-serif; text-align:center; }
  code { background:#22222a; padding:2px 6px; border-radius:4px; }
</style>
<div>
  <h1 style="font-weight:600">Roost</h1>
  <p>Waiting for the daemon.</p>
  <p style="color:#9a948c">If this stays here, start it yourself with <code>roost</code><br>
     and check it is listening on <code>127.0.0.1:8477</code>.</p>
</div>
